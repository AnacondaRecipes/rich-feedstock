{% set name = "rich" %}
{% set version = "13.9.4" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://github.com/Textualize/{{ name }}/archive/refs/tags/v{{ version  }}.tar.gz
  sha256: 22bfd7f24f6107ed222f6ab0cee6f0016e22cb6f91144b90c65b112663c7477c
  patches:
    # Backport upstream Python 3.14 compatibility fixes
    - patches/0001-python-3.14-compat.patch  # [py==314]

build:
  number: 1
  script: {{ PYTHON }} -m pip install . --no-deps --no-build-isolation -vv
  skip: True  # [py<38]

requirements:
  host:
    - pip
    - python
    - poetry-core >=1.0.0
  run:
    - markdown-it-py >=2.2.0
    - pygments >=2.13.0,<3.0.0
    - python
    - typing_extensions >=4.0.0,<5.0.0  # [py<311]
  run_constrained:
    - ipywidgets >=7.5.1,<9

test:
  imports:
    - rich
  source_files:
    - tests
  commands:
    - pip check
    # Pygments 2.21.0 changes the ANSI color used for highlighted whitespace,
    # causing snapshot-style rendering assertions in Rich 13.9.4 to fail
    - pytest -vv tests -k "not (test_inline_code or test_blank_lines or test_markdown_render or test_syntax_highlight_ranges or test_option_no_wrap or test_python_render or test_card_render or test_brokenpipeerror or test_background_color_override_includes_padding)"
  requires:
    - pip
    - pytest
    - attrs

about:
  home: https://github.com/Textualize/rich
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: Rich is a Python library for rich text and beautiful formatting in the terminal.
  description: |
    Rich is a Python library for rich text and beautiful formatting
    in the terminal.The Rich API makes it easy to add color and style to
    terminal output. Rich can also render pretty tables, progress bars,
    markdown, syntax highlighted source code, tracebacks, and more — out
    of the box.
  doc_url: https://rich.readthedocs.io/en/latest/
  dev_url: https://github.com/Textualize/rich

extra:
  recipe-maintainers:
    - jan-janssen
    - willmcgugan
